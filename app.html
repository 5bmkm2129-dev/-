<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ミラコスタ11時 V4</title>
<style>
:root{--bg:#0b1020;--card:#141b2d;--card2:#1a2237;--text:#f7f8fb;--muted:#9aa6bd;--line:#2a3551;--blue:#4f8cff;--green:#37d67a;--yellow:#ffcc66}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
h1{font-size:24px;margin:14px 4px 4px}.sub,.note{color:var(--muted);font-size:13px;line-height:1.55}.clock{text-align:center}
#clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:38px}.row{display:flex;gap:8px;margin-top:10px}
input[type=date]{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:14px;font-size:18px}
button{border:0;border-radius:14px;padding:16px 12px;font-size:16px;font-weight:750;width:100%;background:var(--card2);color:var(--text)}
button:active{transform:scale(.985)}.warm{background:var(--yellow);color:#3f2d00}.harbor{background:var(--blue)}.grand{background:var(--green);color:#062b14}.hero{padding:20px 12px;font-size:18px}
.badge{display:inline-block;background:var(--card2);color:var(--muted);border-radius:999px;padding:5px 9px;font-size:11px;margin-top:7px}
</style>
</head>
<body>
<div class="wrap">
<h1>ミラコスタ11時 V4</h1>
<p class="sub">スマホ優先・自動更新版。実動確認済みURLをそのまま使い、宿泊日だけ差し替えます。</p>

<div class="card clock">
<div id="clock">--:--:--.---</div>
<div id="dateNow"></div>
<div class="badge">最新版自動取得 ON</div>
</div>

<div class="card">
<div class="note" style="margin-bottom:6px">チェックイン日</div>
<input id="stayDate" type="date">
<div class="row">
<button id="set4m">今日＋4か月</button>
<button id="plus1">＋1日</button>
<button id="minus1">－1日</button>
</div>
<p class="note">1泊・1室・大人2名固定。</p>
</div>

<div class="card">
<button id="warmup" class="warm">① 公式トップを事前に開く</button>
<p class="note">10:50台の準備用。</p>

<button id="harbor" class="harbor hero" style="margin-top:16px">② ハーバービュー直行</button>
<button id="grand" class="grand hero" style="margin-top:12px">② ハーバーグランドビュー直行</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const OFFICIAL_TOP='https://reserve.tokyodisneyresort.jp/top/';

const HARBOR_TEMPLATE =
'https://reserve.tokyodisneyresort.jp/sp/hotel/list/?showWay=&roomsNum=1&adultNum=2&childNum=0&stayingDays=1&useDate=__DATE__&cpListStr=&childAgeBedInform=&searchHotelCD=DHM&searchHotelDiv=&hotelName=&searchHotelName=&searchLayer=&searchRoomName=%E3%82%B9%E3%83%9A%E3%83%81%E3%82%A2%E3%83%BC%E3%83%AC%E3%83%BB%E3%83%AB%E3%83%BC%E3%83%A0%EF%BC%86%E3%82%B9%E3%82%A4%E3%83%BC%E3%83%88%E3%80%80%E3%83%9D%E3%83%AB%E3%83%88%E3%83%BB%E3%83%91%E3%83%A9%E3%83%87%E3%82%A3%E3%83%BC%E3%82%BE%E3%83%BB%E3%82%B5%E3%82%A4%E3%83%89%20%E3%83%86%E3%83%A9%E3%82%B9%E3%83%AB%E3%83%BC%E3%83%A0%20%E3%83%8F%E3%83%BC%E3%83%90%E3%83%BC%E3%83%93%E3%83%A5%E3%83%BC&hotelSearchDetail=true&detailOpenFlg=0&checkPointStr=&hotelChangeFlg=false&removeSessionFlg=true&returnFlg=false&hotelShowFlg=&displayType=data-hotel&reservationStatus=1&hotelRoomCd=HODHMTKD0004N#section_HODHMTKD0004N';

const GRAND_TEMPLATE =
'https://reserve.tokyodisneyresort.jp/sp/hotel/list/?showWay=&roomsNum=1&adultNum=2&childNum=0&stayingDays=1&useDate=__DATE__&cpListStr=&childAgeBedInform=&searchHotelCD=DHM&searchHotelDiv=&hotelName=&searchHotelName=&searchLayer=&searchRoomName=%E3%82%B9%E3%83%9A%E3%83%81%E3%82%A2%E3%83%BC%E3%83%AC%E3%83%BB%E3%83%AB%E3%83%BC%E3%83%A0%EF%BC%86%E3%82%B9%E3%82%A4%E3%83%BC%E3%83%88%E3%80%80%E3%83%9D%E3%83%AB%E3%83%88%E3%83%BB%E3%83%91%E3%83%A9%E3%83%87%E3%82%A3%E3%83%BC%E3%82%BE%E3%83%BB%E3%82%B5%E3%82%A4%E3%83%89%20%E3%83%86%E3%83%A9%E3%82%B9%E3%83%AB%E3%83%BC%E3%83%A0%20%E3%83%8F%E3%83%BC%E3%83%90%E3%83%BC%E3%82%B0%E3%83%A9%E3%83%B3%E3%83%89%E3%83%93%E3%83%A5%E3%83%BC&hotelSearchDetail=true&detailOpenFlg=0&checkPointStr=&hotelChangeFlg=false&removeSessionFlg=true&returnFlg=false&hotelShowFlg=&displayType=data-hotel&reservationStatus=1&hotelRoomCd=HODHMTGD0004N';

function fmtInput(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function plusMonthsSameDay(date,months){
  const day=date.getDate();
  const first=new Date(date.getFullYear(),date.getMonth()+months,1);
  const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  return new Date(first.getFullYear(),first.getMonth(),Math.min(day,last));
}
function setDefault(){
  const saved=localStorage.getItem('mira_v4_date');
  $('stayDate').value=saved || fmtInput(plusMonthsSameDay(new Date(),4));
}
setDefault();

$('stayDate').onchange=()=>localStorage.setItem('mira_v4_date',$('stayDate').value);
$('set4m').onclick=()=>{
  $('stayDate').value=fmtInput(plusMonthsSameDay(new Date(),4));
  localStorage.setItem('mira_v4_date',$('stayDate').value);
};
function shift(n){
  const d=new Date($('stayDate').value+'T12:00:00');
  d.setDate(d.getDate()+n);
  $('stayDate').value=fmtInput(d);
  localStorage.setItem('mira_v4_date',$('stayDate').value);
}
$('plus1').onclick=()=>shift(1);
$('minus1').onclick=()=>shift(-1);

function clock(){
  const n=new Date();
  $('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}.${pad(n.getMilliseconds(),3)}`;
  $('dateNow').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
  requestAnimationFrame(clock);
}
requestAnimationFrame(clock);

function getDate8(){
  if(!$('stayDate').value){alert('チェックイン日を選択してください');return null;}
  return $('stayDate').value.replaceAll('-','');
}
function go(template){
  const d=getDate8();
  if(!d)return;
  location.href=template.replace('__DATE__',d);
}
$('warmup').onclick=()=>location.href=OFFICIAL_TOP;
$('harbor').onclick=()=>go(HARBOR_TEMPLATE);
$('grand').onclick=()=>go(GRAND_TEMPLATE);

// iOSがページをメモリから復元した場合は、固定URLを再読込してローダーから最新版を取得。
window.addEventListener('pageshow', (e) => {
  if (e.persisted) location.reload();
});
</script>
</body>
</html>
