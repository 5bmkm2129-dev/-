<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ミラコスタ11時</title>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:24px}.small{opacity:.65;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div>最新版を読み込み中…</div>
  <div class="small">ミラコスタ11時</div>
</div>
<script>
(async () => {
  try {
    const url = './app.html?ts=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML =
      '<div class="box"><div>最新版の読み込みに失敗しました。</div>' +
      '<div class="small">GitHub Pagesのデプロイ完了後に再度開いてください。</div></div>';
  }
})();
</script>
</body>
</html>
